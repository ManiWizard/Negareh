# Owns the native shell dependencies; no optional Tauri plugins or sidecar runtime.
[package]
name = "negareh-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["wry"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17.2", default-features = false }
